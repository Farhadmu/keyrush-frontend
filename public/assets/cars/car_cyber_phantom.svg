<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none">
  <defs>
    <linearGradient id="bodyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="underglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Underglow -->
  <ellipse cx="80" cy="55" rx="65" ry="12" fill="#00F0FF" opacity="0.4" filter="url(#underglow)" />
  <!-- Car Chassis -->
  <path d="M15 50 L35 30 L85 24 L135 35 L150 50 L140 56 L20 56 Z" fill="url(#bodyBlue)" />
  <!-- Windshield / Cockpit -->
  <path d="M50 32 L75 27 L105 32 L95 44 L45 44 Z" fill="#0F172A" stroke="#60A5FA" stroke-width="1.5" />
  <!-- Aero Spoiler -->
  <path d="M12 40 L28 40 L22 48 Z" fill="#1E293B" />
  <!-- Racing Trim -->
  <path d="M40 48 L140 48" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <!-- Wheels -->
  <circle cx="45" cy="56" r="12" fill="#090D16" stroke="#475569" stroke-width="4" />
  <circle cx="45" cy="56" r="4" fill="#00F0FF" />
  <circle cx="125" cy="56" r="12" fill="#090D16" stroke="#475569" stroke-width="4" />
  <circle cx="125" cy="56" r="4" fill="#00F0FF" />
</svg>
