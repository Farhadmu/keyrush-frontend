<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Speed Chevron Icon -->
  <g transform="translate(15, 15)">
    <rect width="90" height="90" rx="24" fill="url(#neonGrad)" filter="url(#glow)" opacity="0.3" />
    <rect width="90" height="90" rx="24" fill="#111827" stroke="url(#primaryGrad)" stroke-width="3" />
    <path d="M35 25 L65 45 L35 65" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M48 35 L68 45 L48 55" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- KEYRUSH Typographic Brand -->
  <text x="130" y="76" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="54" letter-spacing="2" fill="#F8FAFC">
    KEY<tspan fill="url(#primaryGrad)" filter="url(#glow)">RUSH</tspan>
  </text>
  <text x="134" y="98" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" letter-spacing="6" fill="#94A3B8">
    GLOBAL TYPING ESPORTS
  </text>
</svg>
